name: Pipeline de Reproducibilidad Científica (Estándar Q1)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'experiments/**'
      - '.github/workflows/reproduce.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'experiments/**'
  workflow_dispatch:

jobs:
  reproduce-experiment:
    name: Ejecutar y Verificar Pipeline Completo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'experiments/requirements.txt'

      - name: Instalar dependencias científicas congeladas
        run: |
          python -m pip install --upgrade pip
          pip install -r experiments/requirements.txt

      - name: Ejecutar pipeline completo de punta a punta (run_all.py)
        run: |
          python experiments/run_all.py

      - name: Verificar existencia de artefactos obligatorios del paper
        run: |
          echo "Verificando artefactos de datos..."
          test -f experiments/data/DSTM-MineSafe-2026.csv
          test -f experiments/data/datasheet.md
          
          echo "Verificando predicciones y modelos..."
          test -f experiments/results/predictions_fold_level.csv
          test -f experiments/results/baselines_comparison.csv
          test -f experiments/models/final_rf_pipeline.joblib
          
          echo "Verificando explicabilidad XAI (TreeSHAP)..."
          test -f experiments/results/shap_values.csv
          test -f experiments/results/fig_shap_global.png
          test -f experiments/results/fig_shap_local.png
          
          echo "Verificando validación LOSO y estadística inferencial..."
          test -f experiments/results/loso_validation.md
          test -f experiments/results/fig_pr_curves.png
          test -f experiments/results/statistical_tests.md
          
          echo "¡Todos los artefactos requeridos por revisores Q1 fueron validados exitosamente!"

      - name: Subir artefactos de resultados reproducidos
        uses: actions/upload-artifact@v4
        with:
          name: minesafe-q1-reproduced-results
          path: |
            experiments/results/
            experiments/data/datasheet.md
          retention-days: 30
