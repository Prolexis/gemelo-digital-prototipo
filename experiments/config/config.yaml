# experiments/config/config.yaml
# Configuración global del pipeline experimental reproducible MineSafe 3D
# Estándar editorial Q1

seed: 42

data:
  n_samples: 5000
  dataset_name: "DSTM-MineSafe-2026"
  scenarios:
    A: "Acarreo rampa principal (alta velocidad, pendiente pronunciada, polvo moderado)"
    B: "Maniobras en zona de cargue y pala (baja velocidad, proximidad estrecha, visibilidad alta)"
    C: "Tránsito nocturno con fatiga operador (turno acumulado alto, PERCLOS elevado)"
    D: "Clima adverso y visibilidad degradada (polvo denso/niebla, atenuación óptica LiDAR)"
    E: "Flota mixta autónomo-manual (interacción Komatsu 930E AHS y camioneta de supervisión)"
  scenario_distribution: [0.25, 0.20, 0.20, 0.20, 0.15]
  
  # Umbral físico determinista para definición de riesgo de colisión
  ttc_critical_threshold_sec: 4.0
  
  # Umbral independiente para validación de mitigación de circularidad (LOSO)
  ttc_loso_independent_threshold_sec: 3.5
  
  output_csv: "experiments/data/DSTM-MineSafe-2026.csv"
  datasheet_md: "experiments/data/datasheet.md"

features:
  cols:
    - "lidar_obstacle_dist_m"
    - "gnss_speed_kmh"
    - "op_perclos_score"
    - "gnss_ramp_grade"
    - "lidar_visibility_index"
    - "turno_horas_acumuladas"
    - "op_steering_jerk_stddev"
    - "op_harsh_braking_count"
    - "is_autonomous"
  target_col: "collision_risk_label"

training:
  n_splits: 5
  shuffle: true
  
  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 4
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1
    
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.05
    max_depth: 5
    min_samples_leaf: 8
    subsample: 0.85

baselines:
  ttc_physical_thresholds: [3.0, 5.0]
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"

stats:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  mcnemar_exact: true
  significance_alpha: 0.05

paths:
  results_dir: "experiments/results"
  predictions_csv: "experiments/results/predictions_fold_level.csv"
  shap_values_csv: "experiments/results/shap_values.csv"
  shap_global_png: "experiments/results/fig_shap_global.png"
  shap_local_png: "experiments/results/fig_shap_local.png"
  pr_curves_png: "experiments/results/fig_pr_curves.png"
  statistical_report_md: "experiments/results/statistical_tests.md"
  loso_report_md: "experiments/results/loso_validation.md"
  robustness_noise_csv: "experiments/results/robustness_noise.csv"
  robustness_loso_csv: "experiments/results/robustness_loso_noise.csv"
  robustness_png: "experiments/results/fig_robustness_degradation.png"
  robustness_report_md: "experiments/results/robustness_report.md"
